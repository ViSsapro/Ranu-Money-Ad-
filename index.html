<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account - Ranu Money Ad</title>
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <!-- Google Identity Services Library -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <!-- Background Glow Effect -->
    <div class="fixed inset-0 overflow-hidden pointer-events-none">
        <div class="absolute -top-40 -left-40 w-96 h-96 bg-amber-500/10 rounded-full blur-3xl"></div>
        <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-emerald-500/10 rounded-full blur-3xl"></div>
    </div>

    <!-- Main Auth Card Container -->
    <div class="relative w-full max-w-md bg-slate-800/80 backdrop-blur-xl border border-slate-700/80 rounded-3xl p-8 shadow-2xl">
        
        <!-- Logo & Header -->
        <div class="text-center mb-6">
            <div class="inline-flex items-center justify-center bg-gradient-to-r from-amber-400 to-yellow-600 w-14 h-14 rounded-2xl shadow-lg mb-3 text-slate-950 font-black text-xl">
                <i class="fa-solid fa-coins"></i>
            </div>
            <h1 class="text-2xl font-bold text-white mb-1">Ranu Money Ad</h1>
            <p id="sub-title" class="text-slate-400 text-xs">Sign in to start earning daily cash</p>
        </div>

        <!-- Login / Register Switch Tabs -->
        <div class="grid grid-cols-2 bg-slate-900/80 p-1 rounded-2xl mb-6 border border-slate-700/60">
            <button onclick="switchAuthTab('login')" id="tab-login" class="py-2.5 rounded-xl text-xs font-bold text-amber-400 bg-slate-800 shadow transition-all duration-300">
                Sign In
            </button>
            <button onclick="switchAuthTab('register')" id="tab-register" class="py-2.5 rounded-xl text-xs font-bold text-slate-400 hover:text-white transition-all duration-300">
                Create Account
            </button>
        </div>

        <!-- Hidden Google Identity Setup -->
        <div id="g_id_onload"
             data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
             data-context="signin"
             data-ux_mode="popup"
             data-callback="handleCredentialResponse"
             data-auto_prompt="false">
        </div>

        <!-- Google Sign-In / Register Button (Pill Shape) -->
        <div class="mb-5">
            <button onclick="triggerGoogleSignIn()" class="w-full bg-slate-700/80 hover:bg-slate-700 border border-slate-600 text-white font-medium py-3 px-6 rounded-full flex items-center justify-center space-x-3 shadow-md hover:shadow-lg transition-all duration-300 transform hover:-translate-y-0.5">
                <svg class="w-5 h-5" viewBox="0 0 24 24">
                    <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.1 9 5 12 5z"/>
                    <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
                    <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 10.8 0 12s.7 2.3 1.9 4.7l3.7-2.9z"/>
                    <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.1-6.4-5.2L1.9 16c1.8 3.7 5.6 7 10.1 7z"/>
                </svg>
                <span id="google-btn-text" class="text-sm font-semibold">Continue with Google</span>
            </button>
        </div>

        <!-- Divider -->
        <div class="flex items-center my-5">
            <div class="flex-grow border-t border-slate-700"></div>
            <span class="px-3 text-slate-500 text-[11px] font-semibold uppercase">Or with phone number</span>
            <div class="flex-grow border-t border-slate-700"></div>
        </div>

        <!-- FORM 1: LOGIN FORM -->
        <form id="login-form" onsubmit="handlePhoneLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1.5">Phone Number</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 text-sm font-semibold">+94</span>
                    <input type="tel" id="login-phone" pattern="[0-9]{9}" required placeholder="712345678" class="w-full pl-14 pr-4 py-3 bg-slate-900/90 border border-slate-700 rounded-xl text-white text-sm placeholder-slate-600 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition">
                </div>
            </div>

            <div id="login-otp-section" class="hidden space-y-1.5">
                <label class="block text-xs font-medium text-slate-400">Enter OTP Code</label>
                <input type="text" id="login-otp" maxlength="6" placeholder="123456" class="w-full px-4 py-3 bg-slate-900/90 border border-slate-700 rounded-xl text-white text-sm tracking-widest text-center placeholder-slate-600 focus:outline-none focus:border-amber-500 transition">
            </div>

            <button type="submit" id="login-submit-btn" class="w-full bg-gradient-to-r from-amber-500 to-yellow-500 hover:from-amber-600 hover:to-yellow-600 text-slate-950 font-bold py-3 px-6 rounded-full text-sm shadow-lg transition duration-300">
                Send OTP Code
            </button>
        </form>

        <!-- FORM 2: CREATE ACCOUNT FORM (REGISTER) -->
        <form id="register-form" onsubmit="handleRegister(event)" class="hidden space-y-4">
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1.5">Full Name</label>
                <input type="text" id="reg-name" required placeholder="Kasun Perera" class="w-full px-4 py-3 bg-slate-900/90 border border-slate-700 rounded-xl text-white text-sm placeholder-slate-600 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1.5">Phone Number</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-slate-400 text-sm font-semibold">+94</span>
                    <input type="tel" id="reg-phone" pattern="[0-9]{9}" required placeholder="712345678" class="w-full pl-14 pr-4 py-3 bg-slate-900/90 border border-slate-700 rounded-xl text-white text-sm placeholder-slate-600 focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition">
                </div>
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1.5">Referral Code (Optional)</label>
                <input type="text" id="reg-ref" placeholder="e.g. user8923" class="w-full px-4 py-3 bg-slate-900/90 border border-slate-700 rounded-xl text-white text-sm placeholder-slate-600 focus:outline-none focus:border-amber-500 transition">
            </div>

            <div id="reg-otp-section" class="hidden space-y-1.5">
                <label class="block text-xs font-medium text-slate-400">Enter Verification OTP</label>
                <input type="text" id="reg-otp" maxlength="6" placeholder="123456" class="w-full px-4 py-3 bg-slate-900/90 border border-slate-700 rounded-xl text-white text-sm tracking-widest text-center placeholder-slate-600 focus:outline-none focus:border-amber-500 transition">
            </div>

            <button type="submit" id="reg-submit-btn" class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-600 hover:to-teal-600 text-white font-bold py-3 px-6 rounded-full text-sm shadow-lg transition duration-300">
                Register & Get Bonus
            </button>
        </form>

        <!-- Terms Footer -->
        <p class="mt-6 text-center text-xs text-slate-500">
            By proceeding, you agree to our 
            <a href="#" class="text-amber-400 hover:underline">Terms</a> and 
            <a href="#" class="text-amber-400 hover:underline">Privacy Policy</a>.
        </p>

    </div>

    <!-- JS Logic -->
    <script>
        let currentTab = 'login';
        let isLoginOtpSent = false;
        let isRegOtpSent = false;

        // Switch between Login and Register Tabs
        function switchAuthTab(tab) {
            currentTab = tab;
            const loginForm = document.getElementById('login-form');
            const regForm = document.getElementById('register-form');
            const tabLogin = document.getElementById('tab-login');
            const tabRegister = document.getElementById('tab-register');
            const subTitle = document.getElementById('sub-title');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                regForm.classList.add('hidden');
                
                tabLogin.className = "py-2.5 rounded-xl text-xs font-bold text-amber-400 bg-slate-800 shadow transition-all duration-300";
                tabRegister.className = "py-2.5 rounded-xl text-xs font-bold text-slate-400 hover:text-white transition-all duration-300";
                subTitle.innerText = "Sign in to start earning daily cash";
            } else {
                loginForm.classList.add('hidden');
                regForm.classList.remove('hidden');

                tabRegister.className = "py-2.5 rounded-xl text-xs font-bold text-emerald-400 bg-slate-800 shadow transition-all duration-300";
                tabLogin.className = "py-2.5 rounded-xl text-xs font-bold text-slate-400 hover:text-white transition-all duration-300";
                subTitle.innerText = "Create a new account & claim welcome bonus";
            }
        }

        // Trigger Google Login Popup
        function triggerGoogleSignIn() {
            if (typeof google !== 'undefined' && google.accounts) {
                google.accounts.id.prompt();
            } else {
                alert("Google Sign-In SDK loaded failed or Client ID missing.");
            }
        }

        // Handle Real Google Callback Data
        function handleCredentialResponse(response) {
            const user = parseJwt(response.credential);
            
            // Save User Data in Browser LocalStorage
            localStorage.setItem("user_name", user.name);
            localStorage.setItem("user_email", user.email);
            localStorage.setItem("user_pic", user.picture);

            alert("Welcome " + user.name + "!");
            window.location.href = "dashboard.html";
        }

        // Helper: Decode JWT Token
        function parseJwt(token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        // Phone Login Action (Simulated)
        function handlePhoneLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('login-submit-btn');
            const otpSec = document.getElementById('login-otp-section');
            const phone = document.getElementById('login-phone').value;

            if (!isLoginOtpSent) {
                btn.innerText = "Sending Code...";
                setTimeout(() => {
                    isLoginOtpSent = true;
                    otpSec.classList.remove('hidden');
                    btn.innerText = "Verify OTP & Sign In";
                }, 1000);
            } else {
                localStorage.setItem("user_name", "User +94" + phone);
                localStorage.setItem("user_email", "+94" + phone);
                window.location.href = "dashboard.html";
            }
        }

        // Register / Account Creation Action (Simulated)
        function handleRegister(e) {
            e.preventDefault();
            const btn = document.getElementById('reg-submit-btn');
            const otpSec = document.getElementById('reg-otp-section');
            const name = document.getElementById('reg-name').value;
            const phone = document.getElementById('reg-phone').value;

            if (!isRegOtpSent) {
                btn.innerText = "Sending Verification OTP...";
                setTimeout(() => {
                    isRegOtpSent = true;
                    otpSec.classList.remove('hidden');
                    btn.innerText = "Verify & Complete Signup";
                }, 1000);
            } else {
                localStorage.setItem("user_name", name);
                localStorage.setItem("user_email", "+94" + phone);
                window.location.href = "dashboard.html";
            }
        }
    </script>
</body>
</html>
