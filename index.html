<!DOCTYPE html>
<html lang="si" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Sign-In App</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: '#4F46E5',
                    }
                }
            }
        }
    </script>
    <!-- Google Identity Services Library -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <!-- Card Container -->
    <div class="bg-slate-800 border border-slate-700 rounded-2xl p-8 max-w-md w-full shadow-2xl text-center">
        
        <!-- Header -->
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-white mb-2">සාදරයෙන් පිළිගනිමු</h1>
            <p class="text-slate-400 text-sm">ඉදිරියට යාමට ඔබගේ Google ගිණුමෙන් Login වන්න</p>
        </div>

        <!-- Google Identity Onload Configuration -->
        <div id="g_id_onload"
             data-client_id="664887473384-oh8jv0rbigt8utuhmomn2rmkdgdt5vam.apps.googleusercontent.com"
             data-context="signin"
             data-ux_mode="popup"
             data-callback="handleCredentialResponse"
             data-auto_prompt="false">
        </div>

        <!-- Google Official Rendered Button -->
        <div class="mb-6 flex justify-center">
            <div class="g_id_signin"
                 data-type="standard"
                 data-shape="pill"
                 data-theme="outline"
                 data-text="continue_with"
                 data-size="large"
                 data-logo_alignment="left"
                 data-width="340">
            </div>
        </div>

        <!-- Status / Output Message Container -->
        <div id="user-info" class="hidden mt-6 p-4 rounded-xl bg-slate-700/50 border border-slate-600 text-left">
            <h3 class="text-xs font-semibold uppercase tracking-wider text-indigo-400 mb-2">Login සාර්ථකයි!</h3>
            <p class="text-sm font-medium text-slate-200" id="user-name"></p>
            <p class="text-xs text-slate-400 mt-1" id="user-email"></p>
        </div>

    </div>

    <!-- JavaScript Handling -->
    <script>
        // Google Credential Response Handler Function
        function handleCredentialResponse(response) {
            try {
                // Decode JWT Payload
                const responsePayload = parseJwt(response.credential);

                console.log("ID: " + responsePayload.sub);
                console.log('Full Name: ' + responsePayload.name);
                console.log('Given Name: ' + responsePayload.given_name);
                console.log('Family Name: ' + responsePayload.family_name);
                console.log("Image URL: " + responsePayload.picture);
                console.log("Email: " + responsePayload.email);

                // UI Display updates
                document.getElementById('user-name').textContent = "නම: " + responsePayload.name;
                document.getElementById('user-email').textContent = "Email: " + responsePayload.email;
                document.getElementById('user-info').classList.remove('hidden');

            } catch (error) {
                console.error("Token decoding error:", error);
            }
        }

        // JWT Decode Helper Function
        function parseJwt (token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('0' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));

            return JSON.parse(jsonPayload);
        }
    </script>
</body>
</html>
