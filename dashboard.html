<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Ranu Money Ad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6">

    <div class="max-w-md mx-auto bg-slate-800 border border-slate-700 rounded-3xl p-6 shadow-2xl text-center">
        <!-- User Avatar -->
        <img id="user-img" class="w-20 h-20 rounded-full mx-auto border-2 border-amber-400 mb-4 shadow-lg" src="https://via.placeholder.com/80" alt="Profile">
        
        <h2 class="text-xl font-bold text-white">Welcome Back!</h2>
        <p id="user-name" class="text-amber-400 font-semibold text-lg"></p>
        <p id="user-email" class="text-slate-400 text-xs mb-6"></p>

        <div class="bg-slate-900 p-4 rounded-2xl border border-slate-700/60 mb-6">
            <span class="text-xs text-slate-400">Total Balance</span>
            <h1 class="text-3xl font-black text-emerald-400 mt-1">Rs. 0.00</h1>
        </div>

        <button onclick="logout()" class="w-full bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/30 font-semibold py-2.5 rounded-full text-xs transition">
            <i class="fa-solid fa-right-from-bracket mr-2"></i>Logout
        </button>
    </div>

    <script>
        // Load User Data from Local Storage
        const name = localStorage.getItem("user_name");
        const email = localStorage.getItem("user_email");
        const pic = localStorage.getItem("user_pic");

        if(!email) {
            // Unauthenticated User Redirect back to Login
            window.location.href = "index.html";
        } else {
            document.getElementById("user-name").innerText = name;
            document.getElementById("user-email").innerText = email;
            if(pic) document.getElementById("user-img").src = pic;
        }

        function logout() {
            localStorage.clear();
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
